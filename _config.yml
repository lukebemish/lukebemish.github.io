title: Luke Bemish
email: lukebemish@lukebemish.dev
description: >-
  I'm a graduate student interested in systems neuroscience! This is my blog
baseurl: ""
url: "https://lukebemish.dev"
domain: "lukebemish.dev"
show_downloads: false
author: Luke Bemish
paginate: 5

collections:
  category:
    output: true
    permalink: /categories/:slugified_categories:output_ext

theme: unified-docs-theme

markdown: kramdown
permalink: /:year/:month/:day/:title:output_ext
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: paragraph_end
  syntax_highlighter_opts:
    default_lang: plaintext
  template: ""
  math_engine: mathjax
  syntax_highlighter: rouge
exclude:
  - CNAME
sass:
  quiet_deps: true
  silence_deprecations: [import]
highlighter: rouge
gist:
  noscript: false
authors:
  "Luke Bemish":
    gravatar: lukebemish@lukebemish.dev
    fediverse: "@lukebemish@mastodon.social"
social:
  - icon: envelope
    icon_category: solid
    url: mailto:lukebemish@lukebemish.dev
    me: true
  - icon:	github
    url:	https://github.com/lukebemish
    me: true
  - icon: mastodon
    url: https://mastodon.social/@lukebemish
    me: true
  - icon: linkedin
    url: https://www.linkedin.com/in/luke-bemish/
    me: true
    share_url: https://www.linkedin.com/sharing/share-offsite/?
    share_link: url=
  - icon: orcid
    url: https://orcid.org/0009-0006-8214-8050
    me: true
  - icon: rss
    icon_category: solid
    me: false
    url: /feed.xml
webp:
  enabled: true
  img_dir: ["/assets/img/"]
  nested: true

unified-docs-theme:
  nav_pages:
    - page: index.html
      title: Home