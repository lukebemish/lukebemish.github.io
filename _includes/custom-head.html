<script src="https://kit.fontawesome.com/ddd3d23e6a.js" crossorigin="anonymous"></script>
<script src="https://secure.gravatar.com/js/gprofiles.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  Gravatar.init();
});
</script>
{%- if site.authors[page.author]?.fediverse -%}
<meta name="fediverse:creator" content="{{site.authors[page.author].fediverse}}">
{%- endif -%}
<link rel="stylesheet" href="{{ '/assets/css/extra.css' | relative_url }}">
{% if page.activitypub-note -%}
<link rel="alternate" type="application/activity+json" href="{{ site.activity-pub.actor }}/objects{{ page.activitypub-note.url }}" />
{%- endif %}
{% if page.url == "/" -%}
<link rel="alternate me" type="application/activity+json" href="{{ site.activity-pub.actor }}" />
{%- endif %}
